name: communication tests
on:
  pull_request:
    branches: [develop, qa]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communication-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B verify
