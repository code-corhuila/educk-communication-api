services:
  communication-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: '27017'
      MONGO_DATABASE: ${MONGO_DATABASE:-communication_db}
      MONGO_USER: ${MONGO_ROOT_USER:-mongo_admin}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    networks:
      platform:
        aliases: [educk-communication-api]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8085/api/v1/messages/health']
      interval: 10s
      timeout: 5s
      retries: 30
